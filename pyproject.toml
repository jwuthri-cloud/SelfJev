[project]
name = "selfjev"
version = "0.2.0"
description = "Instruction-conditioned binary/multiclass/multilabel decisions with open Qwen models (default: selfjev-4b, Qwen3.5-4B + LoRA, shared-prefix tree)"
authors = [
    { name = "julien-connectly", email = "julien@connectly.ai" }
]
requires-python = ">=3.12"
dependencies = [
    "peft>=0.21.0",
    "safetensors>=0.8.0",
    "torch>=2.14.0",
    "transformers>=5.17.0",
]

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
data = [
    "datasets>=5.0.1",
]
dev = [
    "pre-commit>=4.3.0",
    "pytest>=9.1.1",
    "ruff==0.16.9",
]

[project.scripts]
selfjev = "selfjev.cli:main"

[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = ["reports", "runs", "site"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PIE", "RUF"]
ignore = [
    "E731",   # small lambdas as local helpers are idiomatic here
    "B905",   # zip() without strict= : lengths are checked where it matters
    "RUF001", "RUF002", "RUF003",  # typographic characters (×, –, …) in strings and comments are deliberate
    "SIM108", # ternaries are not always clearer
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]  # sys.path setup before local imports
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
