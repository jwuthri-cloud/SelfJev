[project]
name = "selfjev"
version = "0.2.0"
description = "Instruction-conditioned binary/multiclass/multilabel decisions with open Qwen models (default: selfjev-4b, Qwen3.5-4B + LoRA, shared-prefix tree)"
authors = [
    { name = "julien-connectly", email = "julien@connectly.ai" }
]
requires-python = ">=3.12"
dependencies = [
    "peft>=0.21.0",
    "safetensors>=0.8.0",
    "torch>=2.14.0",
    "transformers>=5.17.0",
]

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
data = [
    "datasets>=5.0.1",
]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
selfjev = "selfjev.cli:main"
