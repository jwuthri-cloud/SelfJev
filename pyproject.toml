[project]
name = "selfjev"
version = "0.2.0"
description = "selfjev: an open decisions model (selfjev-4b) with Jev's API. SDK, server, fine-tuning and RLCD."
authors = [
    { name = "julien-connectly", email = "julien@connectly.ai" }
]
requires-python = ">=3.12"
dependencies = [  # the SDK: `pip install selfjev`
    "httpx>=0.28",
    "pydantic>=2.10",
]

[project.optional-dependencies]
serve = [  # `pip install selfjev[serve]`: the engine and the HTTP server (a CUDA GPU for real use)
    "fastapi>=0.115",
    "peft>=0.21.0",
    "python-multipart>=0.0.20",  # file uploads (fine-tuning)
    "safetensors>=0.8.0",
    "torch>=2.14.0",
    "transformers>=5.17.0",
    "uvicorn[standard]>=0.32",
]
train = [  # `pip install selfjev[train]`: finetune and RLCD
    "peft>=0.21.0",
    "safetensors>=0.8.0",
    "torch>=2.14.0",
    "transformers>=5.17.0",
]
deploy = [  # `selfjev deploy aws`
    "boto3>=1.35",
]
gpu = [  # fast Gated DeltaNet kernels on Linux CUDA boxes (the engine falls back to torch without them)
    "einops>=0.8; sys_platform == 'linux'",
    "flash-linear-attention>=0.3; sys_platform == 'linux'",
]

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
data = [
    "datasets>=5.0.1",
]
dev = [
    "selfjev[serve,train]",
    "pre-commit>=4.3.0",
    "pytest>=9.1.1",
    "ruff==0.16.9",
]

[project.scripts]
selfjev = "selfjev.cli:main"

[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = ["reports", "runs", "site"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PIE", "RUF"]
ignore = [
    "E731",   # small lambdas as local helpers are idiomatic here
    "B905",   # zip() without strict= : lengths are checked where it matters
    "RUF001", "RUF002", "RUF003",  # typographic characters (×, –, …) in strings and comments are deliberate
    "SIM108", # ternaries are not always clearer
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]  # starlette notice, not ours
