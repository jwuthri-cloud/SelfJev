[project]
name = "personal-jev"
version = "0.1.0"
description = "Instruction-conditioned binary/multiclass/multilabel classification with Qwen3-Reranker-0.6B"
authors = [
    { name = "julien-connectly", email = "julien@connectly.ai" }
]
requires-python = ">=3.12"
dependencies = [
    "peft>=0.21.0",
    "safetensors>=0.8.0",
    "torch>=2.14.0",
    "transformers>=5.17.0",
]

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
data = [
    "datasets>=5.0.1",
]
dev = [
    "pytest>=9.1.1",
]
docs = [
    "openai>=3.19.0",
]

[project.scripts]
pjev = "personal_jev.cli:main"
