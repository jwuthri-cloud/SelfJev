# pre-commit install  (once), then every commit runs these; CI runs the same checks
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files  # big files belong in Git LFS (.gitattributes)
        args: [--maxkb=2000]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
